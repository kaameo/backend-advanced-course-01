server:
  port: 8080
spring:
  application:
    name: todo
  output:
    ansi:
      enabled: always
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/todo}
    username: ${DATABASE_USERNAME:todo}
    password: ${DATABASE_PASSWORD:todo}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        use_sql_comments: true
        default_batch_fetch_size: 100
logging:
  level:
    com.beac: DEBUG

